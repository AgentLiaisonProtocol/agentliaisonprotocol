name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  reference:
    name: reference broker (typecheck, tests, vectors, demos)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: reference
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.22.2"
          cache: npm
          cache-dependency-path: reference/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - name: tests, including every conformance vector and the Postgres store
        run: npm test
        env:
          ALP_TEST_POSTGRES_URL: postgres://ci:ci@127.0.0.1:5432/ci
      - run: npm run demo
      - run: npm run demo:federation
      - run: npm run demo:core

  spec:
    name: specification (schemas, vectors, worked examples)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: tools/spec
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.22.2"
      - run: npm ci
      - run: npm run check

  check:
    name: broker checker (quotes, coverage, safety, requirements table, run against the reference broker)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: tools/check
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.22.2"
      - run: npm ci
      - name: tests (in memory; no socket is opened)
        run: npm test
      - name: install the reference broker
        working-directory: reference
        run: npm ci
      # The reference broker with federation on, on 127.0.0.1, and alp-check against example.org through a
      # development host map (plain HTTP on loopback, so no TLS or DNS check runs). See the script's header.
      - name: alp-check against the reference broker
        timeout-minutes: 8
        run: ci/run-against-reference.sh
        env:
          ALP_CHECK_WORK: ${{ runner.temp }}/alp-check-reference
      - name: keep alp-check's JSON report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: alp-check-reference-report
          path: ${{ runner.temp }}/alp-check-reference/report/alp-check-report.json
          if-no-files-found: warn

  site:
    name: documentation site (tests, build, checks)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: tools/site
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22.22.2"
          cache: npm
          cache-dependency-path: tools/site/package-lock.json
      - run: npm ci
      - run: npm test
      - name: build the site and run its checks
        run: node build.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: site
          path: _site
          retention-days: 7
